<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/dtilogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:wght@700&display=swap"
      rel="stylesheet"
    />
    <title>DTI Wedding Fair - Loading</title>
    <style>
      /* Loader container - only affects the loading page */
      #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #212121;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #loader .loading-container {
        text-align: center;
        padding: 2rem;
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
      }

      #loader .brand h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.5px;
        margin-bottom: 0.5rem;
      }

      #loader .brand p {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.9rem;
      }

      #loader .loader {
        width: 70px;
        height: 70px;
        margin: 0 auto;
        position: relative;
      }

      #loader .loader .circle {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #3b82f6, #60a5fa, #93c5fd, #3b82f6);
        animation: loader-spin 1.2s linear infinite;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #loader .loader .circle::after {
        content: '';
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: #212121;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      #loader .loading-text {
        margin-top: 1.5rem;
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }

      #loader .loading-text span {
        display: inline-block;
      }

      #loader .dot {
        animation: loader-pulse 1.4s infinite;
        font-size: 1.2rem;
        line-height: 1;
        margin-left: 2px;
      }

      #loader .dot1 { animation-delay: 0s; }
      #loader .dot2 { animation-delay: 0.2s; }
      #loader .dot3 { animation-delay: 0.4s; }

      @keyframes loader-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes loader-pulse {
        0%, 60%, 100% {
          opacity: 0.2;
          transform: translateY(0px);
        }
        30% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }

      @media (max-width: 480px) {
        #loader .brand h1 {
          font-size: 1.6rem;
        }
        #loader .loader {
          width: 55px;
          height: 55px;
        }
        #loader .loader .circle::after {
          width: 40px;
          height: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="loading-container">
        <div class="brand">
          <h1>DTI EVENT HUB</h1>
          <p>Loading your experience...</p>
        </div>

        <div class="spinner-area">
          <div class="loader">
            <div class="circle"></div>
          </div>
        </div>

        <div class="loading-text">
          <span>Loading</span>
          <span class="dot dot1">.</span>
          <span class="dot dot2">.</span>
          <span class="dot dot3">.</span>
        </div>
      </div>
    </div>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide loader when React app is ready
      function hideLoaderWhenReady() {
        const root = document.getElementById('root');
        const loader = document.getElementById('loader');

        if (root && root.hasChildNodes()) {
          // React has mounted content, hide loader
          if (loader) {
            loader.style.display = 'none';
          }
        } else {
          // Check again in 100ms
          setTimeout(hideLoaderWhenReady, 100);
        }
      }

      // Start checking after a short delay
      setTimeout(hideLoaderWhenReady, 500);
    </script>
  </body>
</html>
